  description: |
    Simple Chatbot with RAG using ollama, open-webui and open-webui-mcpo.
    This blueprint uses CPU Inference. Suitable for PoCs, quick explorations.
    Retrieval-augmented generation uses the ChromaDB vector store embedded in
    open-webui. open-webui is wired to the bundled mcpo proxy, exposing the MCP
    "memory" server as a tool in chat.
    open-webui automatically loads Redis (for websocket session management); no
    separate Redis component needs to be deployed.
    NOTE: The default chat model qwen2.5:3b is licensed under the Qwen Research
    License, which permits research use only.
    See https://huggingface.co/Qwen/Qwen2.5-3B/blob/main/LICENSE.
    For commercial/production deployments, switch to a different model.
    Requires a default StorageClass defined in the cluster for persistent volumes.
    Requires a cert-manager instance running in the cluster.
    The open-webui chat UI is exposed via Ingress at https://suse-ollama-webui;
    point a DNS record (or /etc/hosts entry) for the host "suse-ollama-webui"
    at the cluster's ingress controller to reach it. The hostname can also be patched after deployment.
  displayName: Simple Chatbot with RAG
  version: 1.0.2

