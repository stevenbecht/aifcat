# Portable template: import, Copy, configure, then install. See ../epinio/README.md.
# Empty domain and null registryPassword prevent an unconfigured Helm install.
apiVersion: ai-factory.suse.com/v1alpha1
kind: Blueprint
metadata:
  name: epinio-0-1-0
  labels:
    ai-factory.suse.com/blueprint-name: epinio
    ai-factory.suse.com/blueprint-version: 0.1.0
spec:
  displayName: Epinio
  version: 0.1.0
  source: Custom
  description: >-
    Epinio 1.14.2 with its standalone UI, source storage, and image registry.
    Template: Copy before installing; set global.domain and a unique private
    global.registryPassword in the component values. Requires an existing
    ingress controller, cert-manager, default StorageClass, and an Epinio admin
    user Secret. Reuses the default ingress class, or set ingress.ingressClassName.
    See blueprints/epinio/README.md in the catalog repository for setup and limits.
  components:
    - chartRepo: epinio
      chartName: epinio
      chartVersion: 1.14.2
      values:
        global:
          domain: ""
          registryPassword: null
          tlsIssuer: epinio-ca
          customTlsIssuer: ""
          dex:
            # This chart's Dex template also creates users with known passwords.
            enabled: false
        api:
          # Create the admin user as a separate Secret; never publish credentials.
          users: []
        ingress:
          # Empty selects the cluster default; applications inherit this choice.
          ingressClassName: ""
        certManager:
          install: false
          enabled: true
        certManagerNamespace: cert-manager
        containerregistry:
          storage:
            emptyDir: false
            size: 10Gi
        seaweedfs:
          # Use the cluster's provisioner instead of upstream hostPath defaults.
          s3:
            logs:
              type: emptyDir
          master:
            data:
              type: persistentVolumeClaim
              size: 1Gi
            logs:
              type: emptyDir
          filer:
            data:
              type: persistentVolumeClaim
              size: 1Gi
            logs:
              type: emptyDir
          volume:
            dataDirs:
              - name: data1
                type: persistentVolumeClaim
                size: 10Gi
                maxVolumes: 0
